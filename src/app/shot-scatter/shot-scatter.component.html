<!-- shot-scatter.component.html -->
<div class="panel chart-panel">
  <h3 class="chart-title">{{ chartTitle() }}</h3>

  <svg viewBox="-25 0 50 50">
    <line x1="-25" y1="47" x2="25" y2="47" stroke="var(--court-line)" stroke-width="0.2" />
    <line x1="-25" y1="0" x2="-25" y2="47" stroke="var(--court-line)" stroke-width="0.2" />
    <line x1="25" y1="0" x2="25" y2="47" stroke="var(--court-line)" stroke-width="0.2" />
    <line x1="-25" y1="0" x2="25" y2="0" stroke="var(--court-line)" stroke-width="0.2" />
    <rect x="-8" y="28" width="16" height="19" fill="none" stroke="var(--court-line)" stroke-width="0.2" />
    <circle cx="0" cy="28" r="6" fill="none" stroke="var(--court-line)" stroke-width="0.2" />

    <path
      d="M -4 41.75 A 4 4 0 0 1 4 41.75"
      fill="none" stroke="var(--court-line)" stroke-width="0.2"
    />

    <path
      d="M -22 47 L -22 32.8 A 23.75 23.75 0 0 1 22 32.8 L 22 47"
      fill="none" stroke="var(--court-line)" stroke-width="0.2"
    />

    <line x1="-3" y1="42.5" x2="3" y2="42.5" stroke="var(--court-line)" stroke-width="0.3" />
    <circle cx="0" cy="41.75" r="0.75" fill="none" stroke="var(--court-line)" stroke-width="0.3" />

    @for (shot of filteredShots(); track $index) {
      @if (shot.outcome) {
        <circle
          [attr.cx]="shot.y"
          [attr.cy]="-shot.x"
          r="0.25"
          fill="var(--accent)"
          fill-opacity="0.85"
        />
      } @else {
        <g
          [attr.transform]="'translate(' + shot.y + ',' + (-shot.x) + ')'"
          class="miss-marker"
        >
          <line x1="-0.22" y1="-0.22" x2="0.22" y2="0.22" />
          <line x1="-0.22" y1="0.22" x2="0.22" y2="-0.22" />
        </g>
      }
    }
  </svg>

 <div class="legend">
  <div class="legend-item">
    <span class="swatch make"></span>
    Make
  </div>
  <div class="legend-item">
    <span class="legend-x">✕</span>
    Miss
  </div>
  </div>
</div>

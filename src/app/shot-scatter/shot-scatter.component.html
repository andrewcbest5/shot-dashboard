<svg viewBox="-25 0 50 50" width="500" height="500" >
  <!-- baseline -->
  <line x1="-25" y1="47" x2="25" y2="47" stroke="black" stroke-width="0.2" />

  <!-- sidelines -->
  <line x1="-25" y1="0" x2="-25" y2="47" stroke="black" stroke-width="0.2" />
  <line x1="25" y1="0" x2="25" y2="47" stroke="black" stroke-width="0.2" />

  <!-- half-court line -->
  <line x1="-25" y1="0" x2="25" y2="0" stroke="black" stroke-width="0.2" />

  <!-- free-throw lane (16 ft wide, extends 19 ft from baseline) -->
  <rect x="-8" y="28" width="16" height="19" fill="none" stroke="black" stroke-width="0.2" />

  <!-- free-throw circle (6 ft radius, centered 19 ft from baseline) -->
  <circle cx="0" cy="28" r="6" fill="none" stroke="black" stroke-width="0.2" />

  <!-- restricted area (4 ft radius from basket) -->
  <circle cx="0" cy="41.75" r="4" fill="none" stroke="black" stroke-width="0.2" />

  <!-- three-point arc (23.75 ft radius from basket, roughly) -->
  <path
    d="M -22 47 L -22 32.8 A 23.75 23.75 0 0 1 22 32.8 L 22 47"
    fill="none"
    stroke="black"
    stroke-width="0.2"
  />

 @for (shot of filteredShots(); track $index) {
  <circle
    [attr.cx]="shot.y"
    [attr.cy]="-shot.x"
    r="0.2"
    [attr.fill]="shot.derivedIsThree ? 'orange' : 'black'"
  />
}
</svg>

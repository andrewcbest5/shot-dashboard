<div class="panel">
  <h2 class="panel-title">Filters</h2>

  <label class="field">
    <span class="field-label">Player</span>
    <select (change)="onPlayerChange($event)">
      <option value="">All players</option>
      @for (player of players(); track player.id) {
        <option [value]="player.id">{{ player.name }}</option>
      }
    </select>
  </label>

  <label class="field">
    <span class="field-label">Shot type</span>
    <select (change)="onComplexShotTypeChange($event)">
      <option value="">All shot types</option>
      @for (type of complexShotTypes; track type) {
        <option [value]="type">{{ type }}</option>
      }
    </select>
  </label>

  <label class="field">
    <span class="field-label">Contest level</span>
    <select (change)="onContestLevelChange($event)">
      <option value="">All contest levels</option>
      @for (level of contestLevels; track level) {
        <option [value]="level">{{ level }}</option>
      }
    </select>
  </label>

  <label class="field checkbox-field">
    <input type="checkbox" (change)="onCatchAndShootChange($event)" />
    <span class="field-label">Catch and shoot only</span>
  </label>

  <button class="reset-btn" (click)="onReset()">Reset filters</button>
</div>
